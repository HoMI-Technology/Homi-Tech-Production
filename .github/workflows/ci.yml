name: CI

# Required status check. A red run must block merge to main.
# Configure branch protection: Settings → Branches → main →
#   Require status checks to pass → select "verify".

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Feature branches: agent/bot pushes often skip pull_request events.
      - "feat/**"
      - "fix/**"
      - "chore/**"
  # Manual/API trigger — still useful when a branch name doesn't match globs.
  workflow_dispatch:

# Cancel superseded runs on PRs/feature branches (a new push makes the old
# run moot). NEVER cancel on main: every commit merged to main must be fully
# validated post-merge, and rapid successive merges would otherwise cancel
# each other's runs (showing as spurious "verify (push) — Cancelled" reds).
#
# Keyed per PR (and per ref for push / workflow_dispatch), matching
# lighthouse.yml and e2e.yml. Note the PR lane and the feature-branch push lane
# stay separate on purpose: collapsing them would let a push run cancel the
# pull_request run that branch protection requires for merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publishable, browser-safe values (the anon key is designed to ship to
      # clients). Server-only secrets are NOT needed for typecheck/test/build
      # and must never be added here — they belong in Vercel env scopes.
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpeXljeWt4a3pmYm93aWFweHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODM0NzAsImV4cCI6MjA5NDM1OTQ3MH0.e6bHDRPWZ4aXTkebkG9AmfniE5payNHGul4d8himOj0' }}
      NEXT_PUBLIC_SITE_URL: https://homitechnology.com
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Requires package-lock.json to be committed (Step 0 of the build plan).
      - name: Install (reproducible)
        run: npm ci

      - name: Brand canon check
        run: npm run brand-check

      - name: Architecture feed check
        run: npm run architecture:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx next build

      # Optional but recommended once wired: fails the build if a page
      # regresses Core Web Vitals / a11y below the premium budget.
      # - name: Lighthouse budgets
      #   run: npx unlighthouse-ci --site http://localhost:3000 --budget .lighthouse-budget.json
