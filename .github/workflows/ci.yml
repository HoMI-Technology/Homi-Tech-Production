name: CI

# Required status check. A red run must block merge to main.
# Configure branch protection: Settings → Branches → main →
#   Require status checks to pass → select "verify".
#
# The verify job includes Lighthouse CI (`npx lhci autorun`) against the
# existing lighthouserc.json + lighthouse-budget.json budgets (script transfer
# error at 368640 bytes / ~360 KiB, a11y ≥ 0.95). That is the merge-blocking
# perf gate — do not reintroduce the commented-out unlighthouse stub.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Feature branches: agent/bot pushes often skip pull_request events.
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "grok/**"
  # Manual/API trigger — still useful when a branch name doesn't match globs.
  workflow_dispatch:

# Cancel superseded runs on PRs/feature branches (a new push makes the old
# run moot). NEVER cancel on main: every commit merged to main must be fully
# validated post-merge, and rapid successive merges would otherwise cancel
# each other's runs (showing as spurious "verify (push) — Cancelled" reds).
#
# Keyed per PR (and per ref for push / workflow_dispatch), matching
# lighthouse.yml and e2e.yml. Note the PR lane and the feature-branch push lane
# stay separate on purpose: collapsing them would let a push run cancel the
# pull_request run that branch protection requires for merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Build + unit tests ~8–12m; LHCI (3 runs × public URLs) ~7–10m.
    timeout-minutes: 35
    env:
      # Publishable, browser-safe values (the anon key is designed to ship to
      # clients). Server-only secrets are NOT needed for typecheck/test/build
      # and must never be added here — they belong in Vercel env scopes.
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpeXljeWt4a3pmYm93aWFweHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODM0NzAsImV4cCI6MjA5NDM1OTQ3MH0.e6bHDRPWZ4aXTkebkG9AmfniE5payNHGul4d8himOj0' }}
      NEXT_PUBLIC_SITE_URL: https://homitechnology.com
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      # Dedicated low-value test account for the optional authenticated LH run.
      LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
      LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Requires package-lock.json to be committed (Step 0 of the build plan).
      - name: Install (reproducible)
        run: npm ci

      - name: Brand canon check
        run: npm run brand-check

      - name: Architecture feed check
        run: npm run architecture:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx next build

      # Merge-blocking perf/a11y gate — existing §11 budgets only
      # (lighthouserc.json + lighthouse-budget.json). Hard errors today:
      # resource-summary:script:size ≤ 368640 and categories:accessibility ≥ 0.95.
      - name: Lighthouse CI (public routes — §11 budget)
        run: npx lhci autorun

      - name: Lighthouse CI — authenticated dashboard
        if: env.LHCI_TEST_EMAIL != ''
        run: npx lhci autorun --config=lighthouserc.dashboard.json

      # Always emit coverage truth so a skipped dashboard run is not mistaken
      # for a passing authenticated audit. Public LHCI above remains the gate.
      - name: Coverage truth summary
        if: always()
        run: node scripts/ci-coverage-report.mjs
