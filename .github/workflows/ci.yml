name: CI

# Required status check. A red run must block merge to main.
# Configure branch protection: Settings → Branches → main →
#   Require status checks to pass → select "verify".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual/API trigger — pushes from bot credentials (agent sessions) don't
  # fire pull_request synchronize events, so branches need a way to run CI.
  workflow_dispatch:

concurrency:
  # Feature-branch PRs collapse to the latest push: a newer commit cancels the
  # superseded run to save minutes while iterating. Pushes to main are keyed by
  # commit SHA so a burst of merges each get their own complete run instead of
  # cancelling one another — verify is the required check and the per-commit
  # record of main's health, so a cancelled main run reads as a false failure.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Publishable, browser-safe values (the anon key is designed to ship to
      # clients). Server-only secrets are NOT needed for typecheck/test/build
      # and must never be added here — they belong in Vercel env scopes.
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://homitechnology.com
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Requires package-lock.json to be committed (Step 0 of the build plan).
      - name: Install (reproducible)
        run: npm ci

      - name: Brand canon check
        run: npm run brand-check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx next build

      # Optional but recommended once wired: fails the build if a page
      # regresses Core Web Vitals / a11y below the premium budget.
      # - name: Lighthouse budgets
      #   run: npx unlighthouse-ci --site http://localhost:3000 --budget .lighthouse-budget.json
