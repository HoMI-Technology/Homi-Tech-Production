name: Lighthouse

# Manual / on-demand Lighthouse against the same budgets as CI verify.
#
# Merge-blocking public-route budgets run inside `.github/workflows/ci.yml`
# (`verify` → `npx lhci autorun`). This workflow stays for:
#   · workflow_dispatch / API triggers from agent sessions that skip PR events
#   · authenticated dashboard collection when LHCI_TEST_* secrets are set
#
# Do not invent a second product budget here — budgets live in
# lighthouserc.json, lighthouserc.dashboard.json, and lighthouse-budget.json.

on:
  # Manual/API trigger — pushes from bot credentials (agent sessions) don't
  # fire pull_request synchronize events, so branches need a way to run CI.
  workflow_dispatch:

# Cancel superseded runs, matching ci.yml and e2e.yml. Without this, a new
# dispatch left an obsolete run billing Actions minutes against a commit nobody
# would merge. On a metered private repo that was a large source of wasted
# Actions minutes.
#
# Group key: for workflow_dispatch — where there is no PR payload — one lane
# per ref. A manual run on feat/x never cancels a manual run on feat/y.
# github.workflow keeps the namespace distinct from ci.yml / e2e.yml.
#
# cancel-in-progress is deliberately an expression, not `true`: a run whose ref
# is refs/heads/main (a manual dispatch on main) must always finish, because
# main's results are the post-merge validation record.
#
# DO NOT remove or weaken this block — Lighthouse stays enabled, only
# superseded runs die. Guarded by __tests__/ci/workflow-concurrency.test.ts.
concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpeXljeWt4a3pmYm93aWFweHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODM0NzAsImV4cCI6MjA5NDM1OTQ3MH0.e6bHDRPWZ4aXTkebkG9AmfniE5payNHGul4d8himOj0' }}
      NEXT_PUBLIC_SITE_URL: https://homitechnology.com
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      # puppeteer (login script for the authenticated dashboard run) uses the
      # runner's preinstalled Chrome — never downloads its own.
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      # Dedicated low-value test account for the authenticated run. When the
      # secrets are unset the dashboard step skips itself — public routes are
      # still asserted either way.
      LHCI_TEST_EMAIL: ${{ secrets.LHCI_TEST_EMAIL }}
      LHCI_TEST_PASSWORD: ${{ secrets.LHCI_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npx next build
      - name: Lighthouse CI (asserts §11 budget)
        run: npx lhci autorun
      - name: Lighthouse CI — authenticated dashboard
        if: env.LHCI_TEST_EMAIL != ''
        run: npx lhci autorun --config=lighthouserc.dashboard.json

# The authenticated dashboard run signs in via scripts/lhci-login.cjs using a
# dedicated test account (repo secrets LHCI_TEST_EMAIL / LHCI_TEST_PASSWORD —
# see DEPLOY.md). Budgets live in lighthouserc.dashboard.json: warn-first
# while baseline data accumulates, except CLS and accessibility which gate
# immediately.
