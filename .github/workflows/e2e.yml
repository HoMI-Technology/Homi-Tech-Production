name: E2E

# Playwright smoke over the anonymous funnel journeys (AUTH journeys self-skip
# until E2E_TEST_* secrets are set). Runs on PRs touching app/product surface.

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "middleware.ts"
      - "e2e/**"
      - "playwright.config.ts"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://homitechnology.com
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      # Auth journeys light up only when these are provided as repo secrets.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      # GitHub runners have no preinstalled browser; fetch Chromium here. (In
      # the dev container the browser is preinstalled and the config points at
      # PLAYWRIGHT_CHROMIUM_PATH instead.)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx next build

      - name: E2E (Playwright)
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
