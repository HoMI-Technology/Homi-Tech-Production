name: E2E

# Playwright smoke suite (AUDIT T3.5). Independent of ci.yml / lighthouse.yml —
# separate workflow, separate check, no shared state.
#
# Fork-safe by design: anonymous/local specs always run; specs that need a
# live Supabase test project or Stripe test-mode keys SKIP with a clear
# message when their env is absent (fork PRs receive no secrets), so this
# workflow is green on forks without weakening the signal on repo PRs.
#
# Secrets are only ever exposed on plain `pull_request` and `push` (never
# pull_request_target), and forks can neither push to this repo nor receive
# secrets on their PRs, so fork code cannot reach them.
#
# Runs on push to `main` too: e2e otherwise never ran post-merge, so a PR
# merged with a red e2e left `main` silently broken and taxed every later PR
# (this was #119). Mirrors ci.yml's push triggers so the required `verify`
# check and this suite validate the same refs.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # Feature branches: agent/bot pushes often skip pull_request events.
      - "feat/**"
      - "fix/**"
      - "chore/**"
  # Manual/API trigger — pushes from bot credentials (agent sessions) don't
  # fire pull_request synchronize events, so branches need a way to run CI.
  workflow_dispatch:

# Same lane-per-PR / lane-per-ref keying as ci.yml and lighthouse.yml. main is
# never cancelled: post-merge e2e is the record that main is actually green
# (#119), and rapid successive merges must not cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public, browser-safe values (mirrors ci.yml).
      NEXT_PUBLIC_SUPABASE_URL: https://giyycykxkzfbowiapxpd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpeXljeWt4a3pmYm93aWFweHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODM0NzAsImV4cCI6MjA5NDM1OTQ3MH0.e6bHDRPWZ4aXTkebkG9AmfniE5payNHGul4d8himOj0' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      # --- Live-spec env (specs SKIP when these are empty) ---
      # Supabase test project: the specs read E2E_*; the dev server under test
      # reads the unprefixed names (webhook + admin paths need the service key).
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # Stripe TEST mode only — the suite refuses sk_live_* / non-whsec_* values.
      E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      E2E_STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PLUS: ${{ secrets.E2E_STRIPE_PRICE_PLUS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      # The Chromium download is ~130 MB and was re-fetched on every run. Keyed
      # on the lockfile so a Playwright version bump invalidates it. The install
      # step still runs unconditionally: on a cache hit it skips the download
      # but still installs the OS-level deps, which are not cacheable.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        run: npx playwright test

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
