name: Bundle Size Analysis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install bundle analyzer
        run: npm install -D @next/bundle-analyzer cross-env

      - name: Build with analyzer
        run: npm run analyze
        env:
          NEXT_PUBLIC_SITE_URL: https://homitechnology.com

      - name: Read bundle analysis
        id: bundle
        run: |
          if [ -f .next/analyze/client.html ]; then
            SIZE=$(grep -oP '(?<=Total size: )[^<]+' .next/analyze/client.html || echo "N/A")
            echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          else
            echo "size=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment bundle size on PR
        uses: actions/github-script@v7
        with:
          script: |
            const size = '${{ steps.bundle.outputs.size }}';
            const body = `## 📦 Bundle Size Analysis

            | Metric | Value |
            | --- | --- |
            | Estimated client total | ${size === 'unknown' ? 'N/A (see build logs)' : size} |

            > Install \`@next/bundle-analyzer\` locally and run \`npm run analyze\` to inspect the full breakdown.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('Bundle Size Analysis')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
