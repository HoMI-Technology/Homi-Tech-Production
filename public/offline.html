<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1628" />
    <title>Offline · HōMI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a1628;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 2rem;
      }
      main {
        max-width: 24rem;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      button {
        appearance: none;
        border: 1px solid #334155;
        background: transparent;
        color: #e2e8f0;
        font: inherit;
        padding: 0.6rem 1.4rem;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:hover {
        border-color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="HōMI" />
      <h1>You&rsquo;re offline</h1>
      <p>HōMI needs a connection to show your latest readiness data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
