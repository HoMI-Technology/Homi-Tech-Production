<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="HōMI Threshold Compass static version">
  <title>HōMI Threshold Compass — Static</title>
  <desc>Static version of the Threshold Compass for reduced-motion preferences. No animation.</desc>
  <defs>
    <filter id="cg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cg)">
    <circle cx="100" cy="100" r="85" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.65"/>
    <circle cx="100" cy="15" r="3" fill="#22d3ee"/>
    <circle cx="185" cy="100" r="3" fill="#22d3ee"/>
    <circle cx="100" cy="185" r="3" fill="#22d3ee"/>
    <circle cx="15" cy="100" r="3" fill="#22d3ee"/>
  </g>
  <g filter="url(#cg)">
    <circle cx="100" cy="100" r="60" fill="none" stroke="#34d399" stroke-width="2" opacity="0.75"/>
    <circle cx="100" cy="40" r="2.5" fill="#34d399"/>
    <circle cx="160" cy="100" r="2.5" fill="#34d399"/>
    <circle cx="100" cy="160" r="2.5" fill="#34d399"/>
    <circle cx="40" cy="100" r="2.5" fill="#34d399"/>
  </g>
  <g filter="url(#cg)">
    <circle cx="100" cy="100" r="35" fill="none" stroke="#facc15" stroke-width="2" opacity="0.85"/>
  </g>
  <g filter="url(#cg)">
    <circle cx="100" cy="96" r="5" fill="#facc15"/>
    <rect x="97" y="96" width="6" height="12" rx="1" fill="#facc15"/>
  </g>
</svg>
