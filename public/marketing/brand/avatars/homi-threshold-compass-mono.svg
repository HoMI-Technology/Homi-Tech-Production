<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Threshold Compass monochrome mark"
     fill="none">
  <title>Threshold Compass — Monochrome</title>
  <desc>Single-color Threshold Compass: rings 85/60/35, cardinal outer and middle nodes, keyhole of clarity. Transparent background; inherits color via currentColor.</desc>

  <!-- Outer ring — Financial Reality (cardinal nodes only) -->
  <circle cx="100" cy="100" r="85" stroke="currentColor" stroke-width="2" opacity="0.65"/>
  <circle cx="100" cy="15" r="3" fill="currentColor" opacity="0.65"/>
  <circle cx="185" cy="100" r="3" fill="currentColor" opacity="0.65"/>
  <circle cx="100" cy="185" r="3" fill="currentColor" opacity="0.65"/>
  <circle cx="15" cy="100" r="3" fill="currentColor" opacity="0.65"/>

  <!-- Middle ring — Emotional Truth (cardinal nodes only) -->
  <circle cx="100" cy="100" r="60" stroke="currentColor" stroke-width="2" opacity="0.75"/>
  <circle cx="100" cy="40" r="2.5" fill="currentColor" opacity="0.75"/>
  <circle cx="160" cy="100" r="2.5" fill="currentColor" opacity="0.75"/>
  <circle cx="100" cy="160" r="2.5" fill="currentColor" opacity="0.75"/>
  <circle cx="40" cy="100" r="2.5" fill="currentColor" opacity="0.75"/>

  <!-- Inner ring — Perfect Timing (no nodes) -->
  <circle cx="100" cy="100" r="35" stroke="currentColor" stroke-width="2" opacity="0.85"/>

  <!-- Keyhole of clarity -->
  <circle cx="100" cy="96" r="5" fill="currentColor"/>
  <rect x="97" y="96" width="6" height="12" rx="1" fill="currentColor"/>
</svg>
